name: Build WebLink plugin
on:
  push:
    paths: ["minecraft-plugin/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B package
        working-directory: minecraft-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: WebLink
          path: minecraft-plugin/target/WebLink-*.jar
